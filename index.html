<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>世界音乐漫步 · Soundscape Earth</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <!-- Desktop Simulator Bar -->
  <header class="simulator-desktop-bar">
    <div class="sim-brand-title">
      <span> 世界音乐漫步</span>
      <span style="font-size: 0.7rem; letter-spacing: 1px; opacity: 0.6;">SOUNDSCAPE EARTH</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="sim-btn active" id="btnToggleSim">
        <span>📱</span> <span id="simModeText">iPhone 16 Pro 模拟器</span>
      </button>
      <button class="sim-btn" id="btnLanTest">
        <span>📶</span> <span>真机局域网</span>
      </button>
    </div>
  </header>

  <!-- iPhone 16 Pro Chassis -->
  <div class="device-stage" id="deviceStage">
    <div class="iphone-frame" id="iphoneFrame">
      
      <!-- iOS Status Bar & Dynamic Island -->
      <div class="ios-status-bar">
        <span class="time-clock" id="statusClock">9:41</span>
        
        <!-- Minimal Dynamic Island -->
        <div class="dynamic-island" id="dynamicIsland">
          <span class="island-flag" id="islandFlag">🇨🇳</span>
          <div class="island-wave">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>
        </div>

        <div class="status-glyphs">
          <span>5G</span>
          <span>100%</span>
        </div>
      </div>

      <!-- Pure Screen Interior (No garish blobs, maximum negative space) -->
      <div class="iphone-screen">
        <div class="app-screen-layout">
          
          <!-- Top Zen Navigation -->
          <nav class="zen-top-nav">
            <div class="zen-brand-title">SOUNDSCAPE EARTH</div>
            <div class="zen-top-badge">
              <span class="zen-live-pulse"></span>
              <span>空间声学 · 母带实录</span>
            </div>
          </nav>

          <!-- Hero Center: Ethereal Acoustic Ring & Clean Typography -->
          <div class="zen-hero-center">
            <div class="orb-container">
              <canvas id="visualizerCanvas"></canvas>
              <button class="zen-play-btn" id="playBtn" title="播放 / 暂停">
                <span id="playIcon">▶</span>
              </button>
            </div>

            <div class="zen-track-info">
              <!-- Minimalist Floating Track Navigation -->
              <div class="zen-track-nav">
                <button class="track-nav-chevron" id="btnPrevTrack" title="上一首">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                  </svg>
                </button>
                
                <div class="track-text-group" id="btnOpenTrackSheet" title="展开母带歌单">
                  <div class="track-main-title" id="titleDisplay">醉渔唱晚</div>
                  <div class="track-meta-line">
                    <span class="track-counter" id="trackBadge">01 / 10</span>
                    <span class="meta-separator">·</span>
                    <span class="track-nature-sub" id="subDisplay">古琴实录</span>
                    <span class="track-list-icon" title="歌单">
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                      </svg>
                    </span>
                  </div>
                </div>

                <button class="track-nav-chevron" id="btnNextTrack" title="下一首">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Bottom Controls Area -->
          <div class="zen-bottom-controls">
            
            <!-- Architectural Zen Control Dock: Wander + Country Capsule + Sleep Timer -->
            <div class="zen-dock-row">
              <!-- Random Wander Teleport Button -->
              <button class="zen-dock-btn" id="btnRandom" title="随机漫游到新国度">
                <svg class="dock-svg-icon" id="wanderIconSvg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                  <circle cx="8" cy="8" r="1.2" fill="currentColor"></circle>
                  <circle cx="16" cy="8" r="1.2" fill="currentColor"></circle>
                  <circle cx="12" cy="12" r="1.2" fill="currentColor"></circle>
                  <circle cx="8" cy="16" r="1.2" fill="currentColor"></circle>
                  <circle cx="16" cy="16" r="1.2" fill="currentColor"></circle>
                </svg>
                <span class="dock-btn-label">漫游</span>
              </button>

              <!-- Central Floating Country Capsule -->
              <button class="zen-country-capsule" id="btnOpenCountrySheet" title="点击展开全球声景探索">
                <span class="capsule-flag" id="barFlag">🇨🇳</span>
                <span class="capsule-name" id="barCountryName">中国 · China</span>
                <span class="capsule-chevron">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                </span>
              </button>

              <!-- Sleep Timer with Vertical Slider Popup -->
              <div class="timer-dock-wrap">
                <div class="timer-slider-popup" id="timerSliderPopup">
                  <div class="timer-tick" data-min="90">90<span class="tick-unit">分</span></div>
                  <div class="timer-tick" data-min="60">60<span class="tick-unit">分</span></div>
                  <div class="timer-tick" data-min="45">45<span class="tick-unit">分</span></div>
                  <div class="timer-tick" data-min="30">30<span class="tick-unit">分</span></div>
                  <div class="timer-tick" data-min="15">15<span class="tick-unit">分</span></div>
                  <div class="timer-tick active" data-min="0">关</div>
                </div>
                <button class="zen-dock-btn" id="btnTimerModal" title="睡眠定时关闭">
                  <svg class="dock-svg-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <polyline points="12 7 12 12 15 15"></polyline>
                  </svg>
                  <span class="dock-btn-label" id="dockTimerText">定时</span>
                </button>
              </div>
            </div>


            <!-- Architectural Zen White Noise Soundscape Mixer & Visualizer -->
            <div class="zen-noise-deck" id="noiseDeck">
              <!-- Soundscape Meta Header -->
              <div class="noise-deck-header">
                <button class="noise-meta-left" id="btnMuteToggle" title="点击静音 / 恢复自然声">
                  <span class="noise-type-icon" id="noiseGlyph">🌧️</span>
                  <div class="noise-titles">
                    <span class="noise-category-tag">自然声景</span>
                    <span class="noise-current-label" id="noiseLabel">江南山寺细雨</span>
                  </div>
                </button>

                <div class="noise-meta-right">
                  <span class="noise-pct-badge" id="pctNoise">50%</span>
                  <div class="noise-live-wave" id="noisePulseBars" title="声场共振">
                    <span class="noise-pulse-bar"></span>
                    <span class="noise-pulse-bar"></span>
                    <span class="noise-pulse-bar"></span>
                  </div>
                </div>
              </div>

              <!-- Interactive Acoustic Waveform Fader Bar -->
              <div class="noise-fader-container" id="noiseFaderContainer">
                <canvas id="noiseWaveCanvas" class="noise-wave-canvas"></canvas>
                <div class="noise-level-glow" id="noiseLevelFill" style="width: 50%;"></div>
                <div class="noise-fader-thumb" id="noiseFaderThumb" style="left: 50%;"></div>
                <input type="range" class="noise-native-input" id="sliderNoise" min="0" max="100" value="50" aria-label="自然白噪音音量">
              </div>

              <!-- Minimalist Quick Mood Presets -->
              <div class="noise-preset-row">
                <button class="noise-preset-btn" data-val="0">静音</button>
                <button class="noise-preset-btn" data-val="30">微声 30%</button>
                <button class="noise-preset-btn active" data-val="50">均衡 50%</button>
                <button class="noise-preset-btn" data-val="100">沉浸 100%</button>
              </div>
            </div>

          </div>

        </div>

        <!-- iOS Home Indicator -->
        <div class="ios-home-indicator"></div>

        <!-- Country Exploration Bottom Sheet (iOS HIG Sheet) -->
        <div class="zen-sheet-overlay" id="countrySheet">
          <div class="zen-sheet-card">
            <div class="sheet-drag-handle"></div>
            
            <div class="sheet-header">
              <div class="sheet-title-row">
                <div>
                  <h3 class="sheet-title">全球声景探索</h3>
                  <p class="sheet-subtitle" id="sheetCountrySub">12 个世界国度 · 59 首精选文化母带</p>
                </div>
                <button class="zen-icon-btn" id="btnCloseCountrySheet" style="width: 32px; height: 32px;">✕</button>
              </div>

              <!-- Region Filter Segmented Control (dynamically rendered from data) -->
              <div class="sheet-tabs" id="regionTabs"></div>
            </div>

            <!-- Country Grid List -->
            <div class="sheet-country-grid" id="sheetCountryGrid">
              <!-- Dynamically populated card items -->
            </div>

            <button class="credits-footnote" id="btnOpenCredits" title="素材来源与许可声明">素材与许可来源</button>
          </div>
        </div>

        <!-- Master Tracklist Exploration Sheet (iOS HIG Sheet) -->
        <div class="zen-sheet-overlay" id="trackSheet">
          <div class="zen-sheet-card">
            <div class="sheet-drag-handle"></div>
            
            <div class="sheet-header">
              <div class="sheet-title-row">
                <div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="sheetTrackFlag" style="font-size: 1.3rem;">🇨🇳</span>
                    <h3 class="sheet-title" id="sheetTrackTitle">纯音母带全集</h3>
                    <span class="card-count-badge" id="sheetTrackCount">10 首</span>
                  </div>
                  <p class="sheet-subtitle" id="sheetTrackSub">空间声学无损实录 · 点击即刻跨音轨漫游</p>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <button class="zen-icon-btn" id="btnDrawerShuffle" title="开启/关闭随机播放" style="width: 32px; height: 32px; font-size: 0.95rem;">🔀</button>
                  <button class="zen-icon-btn" id="btnCloseTrackSheet" style="width: 32px; height: 32px;">✕</button>
                </div>
              </div>
            </div>

            <!-- Master Track List -->
            <div class="sheet-track-list" id="sheetTrackList">
              <!-- Dynamically populated track items -->
            </div>

            <button class="credits-footnote" id="btnOpenCreditsTrack" title="素材来源与许可声明">素材与许可来源</button>
          </div>
        </div>

        <!-- Credits & Attribution Sheet (iOS HIG Sheet) -->
        <div class="zen-sheet-overlay" id="creditsSheet">
          <div class="zen-sheet-card">
            <div class="sheet-drag-handle"></div>

            <div class="sheet-header">
              <div class="sheet-title-row">
                <div>
                  <h3 class="sheet-title">素材来源与许可</h3>
                  <p class="sheet-subtitle">音频来自 Wikimedia Commons 自由许可库 · 点击条目跳转试听</p>
                </div>
                <button class="zen-icon-btn" id="btnCloseCredits" style="width: 32px; height: 32px;">✕</button>
              </div>
            </div>

            <div class="credits-list" id="creditsList">
              <!-- Dynamically populated credit entries -->
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
